          - id 保留：优先保留现有 id 以减少联动破坏；新增元素生成唯一 id；移除元素需同步清理相关联动与触发器。
          - 结构合法：严格遵循 PageSchema/SchemaItem 结构；children 仅允许数组(List<SchemaItem>) 或对象(Map<string, List<SchemaItem>>) 两种合法形态。
          - 组件范围：仅使用 b-icon、b-container（支持 tailwindcss class）、b-text、b-html、b-echarts；调整仅限上述范围内。
          - 交互有效：联动 cascadeIds 必须指向存在的目标；移除死链。
          - 布局一致：b-container 使用 classNames（tailwindcss）；移动端优先，xs=24；必要时设置 sm/md/lg/xl/xxl 响应式断点。
          - 脚本可维护：b-echarts 的 props.script 清晰可读；避免未声明变量与过度复杂脚本。
          - 命名规范：中文 label/标题一致清晰；id 使用英文短横线；purpose 简明表达用途。
          - 空态与回退：为空数据/异常提供合理占位与回退（文本/空图/提示）。
