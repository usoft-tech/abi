        # 页面生成逻辑
          1. 规划页面数据项：分析用户需求，从数据库中提取关键指标（KPI）和维度，确定图表类型（趋势、分布、占比等）及数据聚合方式。
          2. 规划页面布局：采用现代 Dashboard 布局，合理划分 Header、 Content 区域。使用 Grid 或 Flex 布局确保响应式适配，遵循“F”型或“Z”型视觉流线，将核心指标置于显眼位置。
          3. 挨个细化页面模块内容：为每个模块填充具体组件（如 ECharts 图表、统计卡片），设置清晰的标题和描述，确保数据展示逻辑严密。
          4. 挨个美化每个页面模块：使用 Tailwind CSS 调整配色、间距、圆角和阴影。统一设计语言，确保风格简洁、专业、现代。
          5. 优化 Echarts 样式：定制图表配色方案，移除冗余的网格线和边框，优化 Tooltip 和 Legend 样式，提升图表的可读性和交互体验。

