app:
  embedding-model:
    enabled: true
    name: default
    provider: openai
    dimensions: 1024
    api_base_url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
    api_key: ${OPENAI_API_KEY}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v3}
  models:
    - name: default
      provider: openai
      temperature: 0.7
      api_base_url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
      api_key: ${OPENAI_API_KEY}
      model: ${OPENAI_DEFAULT_MODEL:gpt-4o-mini}
      max_tokens: ${OPENAI_DEFAULT_MODEL_MAX_TOKENS:1024}

    - name: code
      provider: openai
      temperature: 0.7
      api_base_url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
      api_key: ${OPENAI_API_KEY}
      model: ${OPENAI_CODE_MODEL:gpt-4o-mini}
      max_tokens: ${OPENAI_CODE_MODEL_MAX_TOKENS:1024}

    - name: code-dashscope
      provider: dashscope
      temperature: 0.7
      api_base_url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api_key: ${DASHSCOPE_API_KEY}
      model: ${DASHSCOPE_CODE_MODEL:qwen3.5-plus}
      max_tokens: ${DASHSCOPE_CODE_MODEL_MAX_TOKENS:65536}
